on:
	push:
		branches:["main"]
	pull_request:
		branches:["main"]
jobs:
	build:
		runs-on:ubantu-latest
		steps:
			-name:checkout source code
			 uses:actions/checkout@v4
			-name:set up JDK
			 uses:actions/setup=java@v4
			 with:
				java-version:'17'
				distribution:"temurin"
				cache:maven
			-name:Build with maven
			 run:mvn clean package		
		